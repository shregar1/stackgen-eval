name: Agent Evaluation & Release Gating

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  evaluate:
    name: Evaluate Workplace Agent Traces
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic httpx pytest

      - name: Run Unit & Integration Tests
        run: |
          pytest -v

      - name: Execute Evaluation Pipeline
        run: |
          python checker.py --format summary > $GITHUB_STEP_SUMMARY

      - name: Enforce Release Blocker Gate
        run: |
          python checker.py --fail-on-blocker
