name: Agent Evaluation & Release Gating

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  evaluate:
    name: Evaluate Workplace Agent Traces
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic httpx pytest pytest-cov

      - name: Run Architecture AST Audit (1 Class Per File, 0 Isolated Functions)
        run: |
          python -c "
          import ast, os
          failed = []
          for root, _, files in os.walk('.'):
              if any(p in root for p in ['.git', '.pytest_cache', '__pycache__']): continue
              for f in files:
                  if f.endswith('.py'):
                      path = os.path.join(root, f)
                      tree = ast.parse(open(path).read())
                      classes = [n for n in tree.body if isinstance(n, ast.ClassDef)]
                      funcs = [n for n in tree.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))]
                      if funcs: failed.append(f'{path}: isolated function found')
                      if f != '__init__.py' and len(classes) != 1: failed.append(f'{path}: expected 1 class, got {len(classes)}')
          assert not failed, f'Architecture audit failed: {failed}'
          "

      - name: Run Unit & Integration Tests (100% Pass Rate)
        run: |
          pytest -v --cov=src

      - name: Execute Evaluation Pipeline & Publish Summary
        run: |
          python checker.py --format summary > $GITHUB_STEP_SUMMARY
          python checker.py > output.json
          python -c "import json; data = json.load(open('output.json')); assert data['summary']['total_traces'] == 8"

      - name: Verify Release Blocker Gate Behavior
        run: |
          # Verify --fail-on-blocker exits with code 1 when blockers exist in candidate
          if python checker.py --fail-on-blocker; then
            echo "Error: Gate should have blocked deployment"
            exit 1
          else
            echo "Release blocker gate successfully triggered and blocked deployment!"
          fi
